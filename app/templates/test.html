<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MCQ Test</title>
    <script>
        let timeLeft = 600; // 10 minutes in seconds
        function startTimer() {
            const timer = document.getElementById("timer");
            const interval = setInterval(() => {
                const minutes = Math.floor(timeLeft / 60);
                const seconds = timeLeft % 60;
                timer.textContent = `${minutes}:${seconds < 10 ? "0" : ""}${seconds}`;
                timeLeft--;
                if (timeLeft < 0) {
                    clearInterval(interval);
                    document.getElementById("testForm").submit();
                }
            }, 1000);
        }
    </script>
</head>
<body onload="startTimer()">
    <h1>MCQ Test</h1>
    <p>Time Remaining: <span id="timer">10:00</span></p>
    <form id="testForm" method="POST" action="/submit">
        {% for question in questions %}
            <div>
                <p>{{ question[1]}} {{question[7]}} {{question[8]}}</p>
                {% for option in question[2:6] %}
                    <label>
                        <input type="radio" name="{{ question[0] }}" value="{{ option }}" required>
                        {{ option }}
                    </label><br>
                {% endfor %}
            </div>
        {% endfor %}
        <button type="submit">Submit</button>
    </form>
</body>
</html>
